services:
  postgres:
    image: postgres:16-alpine
    container_name: kanri-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kanri
      POSTGRES_PASSWORD: kanri
      POSTGRES_DB: kanri
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kanri -d kanri']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
