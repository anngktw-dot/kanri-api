services:
  api:
    build:
      context: .
    container_name: kanri-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kanri:kanri@postgres:5432/kanri?schema=public
      JWT_SECRET: ${JWT_SECRET:-replace-with-secure-secret}
      PORT: 3000
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-604800}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - '3000:3000'
    command: sh -c "npx prisma migrate deploy && node dist/src/server.js"

  postgres:
    image: postgres:16-alpine
    container_name: kanri-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: kanri
      POSTGRES_PASSWORD: kanri
      POSTGRES_DB: kanri
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kanri -d kanri']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
