name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kanri
          POSTGRES_PASSWORD: kanri
          POSTGRES_DB: kanri
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kanri -d kanri"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kanri:kanri@localhost:5432/kanri?schema=public
      JWT_SECRET: ci-secret-change-me
      PORT: 3000
      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_SECONDS: 604800
      CORS_ORIGIN: '*'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run prisma:deploy

      - name: Seed database
        run: npm run prisma:seed

      - name: Check
        run: npm run check

      - name: Integration tests
        run: npm run test:integration

      - name: Build Docker image
        run: docker build -t kanri-api:ci .
