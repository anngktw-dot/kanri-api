<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kanri - Вхід</title>
    <link rel="icon" href="/assets/kanri-logo.png" />
    <link rel="stylesheet" href="/assets/register.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Kanri">
        <img class="brand-logo" src="/assets/kanri-logo.png" alt="" />
        <span>Kanri</span>
      </a>
    </header>

    <main class="register-page">
      <section class="intro" aria-labelledby="login-title">
        <div class="intro-copy">
          <h1 id="login-title">Увійти в акаунт</h1>
          <p>Поверніться до задач і командної роботи</p>
        </div>
        <img class="intro-illustration" src="/assets/register-illustration.png" alt="" />
      </section>

      <section class="form-card" aria-label="Форма входу">
        <form class="register-form" id="login-form" novalidate>
          <div class="field">
            <label for="email">Пошта</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="Введіть вашу пошту"
              required
            />
          </div>

          <div class="field">
            <label for="password">Пароль</label>
            <div class="password-control">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Введіть пароль"
                required
              />
              <button
                class="icon-button"
                type="button"
                data-toggle-password="password"
                aria-label="Показати пароль"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M2.06 12.35a1 1 0 0 1 0-.7C3.64 7.5 7.64 5 12 5s8.36 2.5 9.94 6.65a1 1 0 0 1 0 .7C20.36 16.5 16.36 19 12 19s-8.36-2.5-9.94-6.65Z"
                  />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <p class="form-message" id="form-message" aria-live="polite"></p>

          <button class="submit-button" type="submit">Увійти</button>

          <p class="login-link">Немає акаунта? <a href="/register">Зареєструватися</a></p>
        </form>
      </section>
    </main>

    <div class="toast-region" id="toast-region" aria-live="assertive" aria-atomic="true"></div>

    <script src="/assets/login.js" defer></script>
  </body>
</html>
